# Dependabot keeps the Go module graph, the web lockfile, the pinned action
# SHAs and the container base images current. Every update for an ecosystem,
# majors included, lands in ONE pull request per ecosystem, at most monthly,
# so the maintainer sees four pull requests a month at the most instead of a
# notification per package. A major that breaks the build is fixed in that
# same pull request rather than argued about across several.

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      go-all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy
      - /deploy/rtl433
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-all:
        patterns: ["*"]
