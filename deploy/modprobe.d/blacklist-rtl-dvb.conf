# Keep the kernel DVB-T driver away from RTL2832U based SDR dongles.
#
# Without this the dvb_usb_rtl28xxu module claims the dongle as a TV tuner
# the moment it is plugged in, and rtl_433 fails with "usb_claim_interface
# error -6". Install to /etc/modprobe.d/ and either reboot or run
# "modprobe -r dvb_usb_rtl28xxu" once.

blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
# Tuner drivers that load alongside the DVB front end.
blacklist r820t
blacklist e4000
blacklist fc0012
blacklist fc0013
blacklist fc2580
blacklist tua9001
