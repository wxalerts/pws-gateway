# Drop-in for chrony.service: let pwsgw write to the LTE time socket.
#
# chronyd creates the "refclock SOCK" socket owned by root with mode 0755, so
# the unprivileged daemon cannot send to it. Hand it to the pwsgw group. The
# "+" runs the commands outside chrony.service's capability limits.
# Install as /etc/systemd/system/chrony.service.d/pwsgw-lte.conf, then
# systemctl daemon-reload && systemctl restart chrony.
[Service]
ExecStartPost=+/usr/bin/chgrp pwsgw /run/pwsgw-chrony/lte.sock
ExecStartPost=+/usr/bin/chmod 0660 /run/pwsgw-chrony/lte.sock
