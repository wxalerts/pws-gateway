# chrony sources added by the WxAlerts PWS Gateway.
#
# Install as /etc/chrony/conf.d/pwsgw.conf (Raspberry Pi OS chrony reads that
# directory) and restart chrony. NTP stays the preferred source: these only
# take over when the network time servers are unreachable or when a GPS with a
# pulse-per-second line is attached.
#
# chronyd is the only thing that sets the clock. pwsgw never does.

# GPS time from gpsd shared memory. gpsd must run with -n so it feeds chrony
# before any client connects. Without a PPS line the NMEA time is only good to
# a fraction of a second, so it is given a wide error budget.
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

# GPS pulse per second, when the receiver wires one (gpsd puts it in SHM 1).
# Locked to the GPS time above so the second is unambiguous. Ignored by
# chrony when gpsd supplies no pulse.
refclock SHM 1 refid PPS precision 1e-7 lock GPS noselect

# LTE network time. pwsgw writes one sample a minute to this socket from the
# modem's network clock (ModemManager). Carrier time is only good to about a
# second, so it carries stratum 10 and a one second precision: it wins only
# when nothing better is reachable, which is the case it exists for, an offline
# boot behind an LTE link.
refclock SOCK /run/pwsgw-chrony/lte.sock refid LTE precision 1e0 stratum 10

# Track the DS3231 through the kernel RTC driver and write the corrected
# system time back to it (requires dtoverlay=i2c-rtc,ds3231 in config.txt).
rtcdevice /dev/rtc0
rtcsync
